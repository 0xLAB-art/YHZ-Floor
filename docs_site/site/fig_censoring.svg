<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<rect x="1" y="1" width="1398" height="558" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="40" y="52" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#e6edf3">The allowance censors the number</text><text x="40" y="80" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1">One published protocol, re-run on its own frozen inputs. Only the token allowance moves — each raise a numbered amendment, recorded before it ran.</text>
<line x1="40" y1="410" x2="730" y2="410" stroke="#30363d"/>
<rect x="70" y="290.0" width="250" height="120.0" rx="8" fill="#6e7681" opacity="0.85"/>
<text x="195.0" y="276.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#e6edf3" text-anchor="middle">20/50</text>
<text x="195.0" y="438" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e6edf3" text-anchor="middle">declared allowance — 12,000 tokens</text>
<text x="195.0" y="462" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">task-level pairs: 6/10</text>
<rect x="450" y="242.0" width="250" height="168.0" rx="8" fill="#3fb950" opacity="0.85"/>
<text x="575.0" y="228.0" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#e6edf3" text-anchor="middle">28/50</text>
<text x="575.0" y="438" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#e6edf3" text-anchor="middle">raised — 32k, then 64k</text>
<text x="575.0" y="462" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1" text-anchor="middle">task-level pairs: 8/10</text>
<text x="760" y="126" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">30 of 60 sessions never acted</text>
<text x="760" y="148" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">every turn consumed by hidden reasoning — zero</text>
<text x="760" y="167" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">submissions at the declared allowance</text>
<text x="760" y="234" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">recovered, not failed</text>
<text x="760" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">the raises turn censored slots into solves:</text>
<text x="760" y="275" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">6/10 → 8/10 pairs, identical under all five</text>
<text x="760" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">evaluator rules</text>
<text x="760" y="342" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">transport-unmeasured: 17 slots</text>
<text x="760" y="364" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">HTTP 504, zero turns, every retry — excluded</text>
<text x="760" y="383" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">from the scored set; never a model failure</text>
<text x="40" y="540" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1">A published rate is only as strong as the allowance it was measured under — one that does not state its allowance has not stated its own meaning.</text>
</svg>