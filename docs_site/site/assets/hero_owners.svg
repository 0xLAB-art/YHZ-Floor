<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg { fill: #0b1218; }
    .title { fill: #ecf3f9; font-size: 21px; font-weight: 600; letter-spacing: .4px; }
    .sub   { fill: #8fa8bd; font-size: 12.5px; }
    .cname { fill: #ecf3f9; font-size: 13.5px; font-weight: 600; }
    .cstat { fill: #c9d9e8; font-size: 12px; }
    .ctag  { fill: #6d8296; font-size: 10px; }
    .cfoot { fill: #6d8296; font-size: 9.5px; letter-spacing: .5px; }
    .card  { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
    .pulse { opacity: .15; animation: pulse 2.6s ease-in-out infinite; }
    .beam  { stroke: #235480; stroke-width: 1.2; opacity: .55; stroke-dasharray: 5 7;
             animation: dash 3.2s linear infinite; }
    .floor { transform-origin: 480px 322px; animation: tilt 14s ease-in-out infinite alternate; }
    @keyframes rise   { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse  { 0%,100% { opacity: .12; } 50% { opacity: .95; } }
    @keyframes dash   { to   { stroke-dashoffset: -48; } }
    @keyframes tilt   { from { transform: rotate(-.6deg) scaleY(.985); } to { transform: rotate(.6deg) scaleY(1.015); } }
  </style>
  <rect class="bg" width="960" height="360" rx="12"/>
  <text x="480" y="40" text-anchor="middle" class="title">Who owns the number? &#8212; five owners, one frozen intervention each</text>
  <text x="480" y="62" text-anchor="middle" class="sub">paired contrasts on shared seeds &#183; pre-registered &#183; every null measured, never pooled</text>
  <g class="floor">
    <rect x="120" y="318" width="720" height="3" rx="1.5" fill="#235480" opacity=".85"/>
    <rect x="180" y="324" width="600" height="2" rx="1" fill="#235480" opacity=".45"/>
  </g>
  
  <g class="card" style="animation-delay:0.15s">
    <rect x="60" y="118" width="160" height="190" rx="10"
          fill="#17222e" stroke="#7fb3dd" stroke-width="1.4"/>
    <text x="140.0" y="152" text-anchor="middle" class="cname">Admission</text>
    <rect x="74" y="174" width="132" height="14" rx="7" fill="#0d151d"/>
    <rect x="74" y="174" width="0" height="14" rx="7" fill="#7fb3dd">
      <animate attributeName="width" from="0" to="103"
               begin="0.50s" dur="1.4s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.8 0.3 1"/>
    </rect>
    <text x="140.0" y="218" text-anchor="middle" class="cstat">-0.8 → -32.8 → +3.9 pp</text>
    <text x="140.0" y="246" text-anchor="middle" class="ctag">registered &#183; hash-frozen</text>
    <circle class="pulse" style="animation-delay:1.20s"
            cx="140.0" cy="276" r="5" fill="#7fb3dd"/>
    <text x="140.0" y="296" text-anchor="middle" class="cfoot">intervention measured</text>
  </g>
  <g class="card" style="animation-delay:0.37s">
    <rect x="238" y="118" width="160" height="190" rx="10"
          fill="#17222e" stroke="#5aa876" stroke-width="1.4"/>
    <text x="318.0" y="152" text-anchor="middle" class="cname">Information contract</text>
    <rect x="252" y="174" width="132" height="14" rx="7" fill="#0d151d"/>
    <rect x="252" y="174" width="0" height="14" rx="7" fill="#5aa876">
      <animate attributeName="width" from="0" to="127"
               begin="0.75s" dur="1.4s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.8 0.3 1"/>
    </rect>
    <text x="318.0" y="218" text-anchor="middle" class="cstat">96/0 one-way, Holm 4.0e-28</text>
    <text x="318.0" y="246" text-anchor="middle" class="ctag">registered &#183; hash-frozen</text>
    <circle class="pulse" style="animation-delay:1.50s"
            cx="318.0" cy="276" r="5" fill="#5aa876"/>
    <text x="318.0" y="296" text-anchor="middle" class="cfoot">intervention measured</text>
  </g>
  <g class="card" style="animation-delay:0.59s">
    <rect x="416" y="118" width="160" height="190" rx="10"
          fill="#17222e" stroke="#d9a441" stroke-width="1.4"/>
    <text x="496.0" y="152" text-anchor="middle" class="cname">Session wrapper</text>
    <rect x="430" y="174" width="132" height="14" rx="7" fill="#0d151d"/>
    <rect x="430" y="174" width="0" height="14" rx="7" fill="#d9a441">
      <animate attributeName="width" from="0" to="42"
               begin="1.00s" dur="1.4s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.8 0.3 1"/>
    </rect>
    <text x="496.0" y="218" text-anchor="middle" class="cstat">0/32 null, ≤10.7% Wilson</text>
    <text x="496.0" y="246" text-anchor="middle" class="ctag">registered &#183; hash-frozen</text>
    <circle class="pulse" style="animation-delay:1.80s"
            cx="496.0" cy="276" r="5" fill="#d9a441"/>
    <text x="496.0" y="296" text-anchor="middle" class="cfoot">intervention measured</text>
  </g>
  <g class="card" style="animation-delay:0.81s">
    <rect x="594" y="118" width="160" height="190" rx="10"
          fill="#17222e" stroke="#c98a4b" stroke-width="1.4"/>
    <text x="674.0" y="152" text-anchor="middle" class="cname">Compute allowance</text>
    <rect x="608" y="174" width="132" height="14" rx="7" fill="#0d151d"/>
    <rect x="608" y="174" width="0" height="14" rx="7" fill="#c98a4b">
      <animate attributeName="width" from="0" to="74"
               begin="1.25s" dur="1.4s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.8 0.3 1"/>
    </rect>
    <text x="674.0" y="218" text-anchor="middle" class="cstat">20/50 → 28/50 (16 pp)</text>
    <text x="674.0" y="246" text-anchor="middle" class="ctag">registered &#183; hash-frozen</text>
    <circle class="pulse" style="animation-delay:2.10s"
            cx="674.0" cy="276" r="5" fill="#c98a4b"/>
    <text x="674.0" y="296" text-anchor="middle" class="cfoot">intervention measured</text>
  </g>
  <g class="card" style="animation-delay:1.03s">
    <rect x="772" y="118" width="160" height="190" rx="10"
          fill="#17222e" stroke="#b96a6a" stroke-width="1.4"/>
    <text x="852.0" y="152" text-anchor="middle" class="cname">Execution evidence</text>
    <rect x="786" y="174" width="132" height="14" rx="7" fill="#0d151d"/>
    <rect x="786" y="174" width="0" height="14" rx="7" fill="#b96a6a">
      <animate attributeName="width" from="0" to="16"
               begin="1.50s" dur="1.4s" fill="freeze"
               calcMode="spline" keySplines="0.25 0.8 0.3 1"/>
    </rect>
    <text x="852.0" y="218" text-anchor="middle" class="cstat">0/44 combined promotions</text>
    <text x="852.0" y="246" text-anchor="middle" class="ctag">registered &#183; hash-frozen</text>
    <circle class="pulse" style="animation-delay:2.40s"
            cx="852.0" cy="276" r="5" fill="#b96a6a"/>
    <text x="852.0" y="296" text-anchor="middle" class="cfoot">intervention measured</text>
  </g>
  <line class="beam" x1="480" y1="76" x2="200" y2="112"/>
  <line class="beam" x1="480" y1="76" x2="480" y2="112"/>
  <line class="beam" x1="480" y1="76" x2="760" y2="112"/>
</svg>
