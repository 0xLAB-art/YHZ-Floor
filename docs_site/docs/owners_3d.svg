<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .pillar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
              animation: grow 0.9s cubic-bezier(.2,.7,.3,1) forwards; }
    .p1 { animation-delay: .15s } .p2 { animation-delay: .35s } .p3 { animation-delay: .55s }
    .p4 { animation-delay: .75s } .p5 { animation-delay: .95s }
    .slab  { opacity: 0; animation: drop 0.7s cubic-bezier(.3,1.4,.4,1) 1.5s forwards; }
    .cap   { opacity: 0; animation: fadein 0.5s ease 1.9s forwards; }
    .lbl   { opacity: 0; animation: fadein 0.5s ease forwards; }
    .l1{animation-delay:.5s}.l2{animation-delay:.7s}.l3{animation-delay:.9s}.l4{animation-delay:1.1s}.l5{animation-delay:1.3s}
    .glowline { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 1.2s ease 2.3s forwards; }
    @keyframes grow  { to { transform: scaleY(1); } }
    @keyframes drop  { 0% { opacity: 0; transform: translateY(-26px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes fadein{ to { opacity: 1; } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    text { fill: #7d8590; }
    .owner { fill: #adbac7; font-weight: 600; font-size: 15px; }
    .metric { font-size: 11.5px; }
  </style>

  <!-- ground line -->
  <line x1="40" y1="312" x2="820" y2="312" stroke="#30363d" stroke-width="2"/>

  <!-- ===== five isometric pillars =====
       each pillar: front face + right side + top, dx=16 dy=9 depth -->
  <!-- P1 Admission (h=150) x=70 -->
  <g class="pillar p1">
    <rect x="70" y="162" width="74" height="150" fill="#58a6ff"/>
    <polygon points="144,162 160,153 86,153 70,162" fill="#79b8ff"/>
    <polygon points="144,312 160,303 160,153 144,162" fill="#316dca"/>
  </g>
  <!-- P2 Information (h=190) x=212 -->
  <g class="pillar p2">
    <rect x="212" y="122" width="74" height="190" fill="#bc8cff"/>
    <polygon points="286,122 302,113 228,113 212,122" fill="#d2a8ff"/>
    <polygon points="286,312 302,303 302,113 286,122" fill="#8a63d2"/>
  </g>
  <!-- P3 Wrapper (h=120) x=354 -->
  <g class="pillar p3">
    <rect x="354" y="192" width="74" height="120" fill="#3fb950"/>
    <polygon points="428,192 444,183 370,183 354,192" fill="#56d364"/>
    <polygon points="428,312 444,303 444,183 428,192" fill="#2ea043"/>
  </g>
  <!-- P4 Allowance (h=165) x=496 -->
  <g class="pillar p4">
    <rect x="496" y="147" width="74" height="165" fill="#f78166"/>
    <polygon points="570,147 586,138 512,138 496,147" fill="#ffa657"/>
    <polygon points="570,312 586,303 586,138 570,147" fill="#c2573a"/>
  </g>
  <!-- P5 Evidence (h=135) x=638 -->
  <g class="pillar p5">
    <rect x="638" y="177" width="74" height="135" fill="#e3b341"/>
    <polygon points="712,177 728,168 654,168 638,177" fill="#f2cc60"/>
    <polygon points="712,312 728,303 728,168 712,177" fill="#b58a26"/>
  </g>

  <!-- ===== the floor slab ===== -->
  <g class="slab">
    <rect x="52" y="88" width="722" height="40" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.4"/>
    <text x="413" y="108" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700" letter-spacing="1">THE YHZ FLOOR</text>
    <text x="413" y="122" text-anchor="middle" fill="#7d8590" font-size="10.5" letter-spacing="2">STRIP · DECLARE · SEPARATE · PUBLISH · BIND</text>
  </g>

  <!-- ===== labels ===== -->
  <g text-anchor="middle">
    <text class="owner l1" x="107" y="336">Admission</text>
    <text class="metric l1" x="107" y="352">−0.8 → −32.8 → +3.9 pp</text>
    <text class="metric l1" x="107" y="365">100/101 traces</text>

    <text class="owner l2" x="249" y="336">Information</text>
    <text class="metric l2" x="249" y="352">96/0 one-way · 15 Holm-sig</text>
    <text class="metric l2" x="249" y="365">GCM-SIV accepts nothing</text>

    <text class="owner l3" x="391" y="336">Wrapper</text>
    <text class="metric l3" x="391" y="352">0/32 each direction</text>
    <text class="metric l3" x="391" y="365">≤ 10.7% (Wilson 95%)</text>

    <text class="owner l4" x="533" y="336">Allowance</text>
    <text class="metric l4" x="533" y="352">20/50 → 28/50 raised</text>
    <text class="metric l4" x="533" y="365">17 slots unmeasured</text>

    <text class="owner l5" x="675" y="336">Evidence</text>
    <text class="metric l5" x="675" y="352">combination 0/44</text>
    <text class="metric l5" x="675" y="365">vs 16/44 · 28/44 alone</text>
  </g>

  <!-- caption -->
  <text x="430" y="390" text-anchor="middle" font-size="11" fill="#7d8590" font-style="italic">five owners, one frozen intervention each — cohorts are never pooled</text>
</svg>
